; OBD-II gauge cluster for the Waveshare ESP32-S3-Touch-LCD-4.3B (800x480 ST7262 RGB, GT911 touch)
;
; Uses the pioarduino platform (Arduino-ESP32 3.3.x / ESP-IDF 5.5). The official
; PlatformIO espressif32 platform ships an older Arduino core that the RGB panel
; driver in Arduino_GFX does not support well.

[env:waveshare_s3_lcd43b]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; ESP32-S3-WROOM-1-N16R8: 16 MB QIO flash, 8 MB octal PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.f_cpu = 240000000L

monitor_speed = 115200
monitor_port = COM18

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DLV_CONF_INCLUDE_SIMPLE
    -I include

lib_deps =
    lvgl/lvgl@9.2.2
    moononournation/GFX Library for Arduino@^1.5.0
